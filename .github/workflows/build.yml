name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    types:
      - labeled

jobs:
  release:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout@v4

      - name: Bump version on merging Pull Requests with specific labels
        id: bumpr
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: haya14busa/action-bumpr@a2a70ab97602f0d0f2d23ff3c9f8d7144a99f6e7 # haya14busa/action-bumpr@v1

      - name: Update corresponding major and minor tag
        uses: haya14busa/action-update-semver@621d0de22303d6decc3ee9d1858a70622a8db614 # haya14busa/action-update-semver@v1
        if: "!steps.bumpr.outputs.skip"
        with:
          tag: ${{ steps.bumpr.outputs.next_version }}

      - name: Get tag name
        id: tag
        uses: haya14busa/action-cond@d0c3785880c08a358711ee8047f593cbcf1cdcfd # haya14busa/action-cond@v1
        with:
          cond: "${{ startsWith(github.ref, 'refs/tags/') }}"
          if_true: ${{ github.ref }}
          if_false: ${{ steps.bumpr.outputs.next_version }}

      - id: version_tag
        run: echo "::set-output name=tag::$(echo ${{steps.tag.outputs.value}} | cut -c 2-)"

      - name: Create release
        uses: shogo82148/actions-create-release@674574da01c46cef82b04779a45c59dc42380199 # shogo82148/actions-create-release@v1
        if: "steps.tag.outputs.value != ''"
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.tag.outputs.value }}
          release_name: Release ${{ steps.tag.outputs.value }}
          body: ${{ steps.bumpr.outputs.message }}
          draft: false
          prerelease: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # actions/setup-go@v5
        if: "steps.tag.outputs.value != ''"
        with:
          go-version: '>=1.18.0'

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # docker/login-action@v3
        if: "steps.tag.outputs.value != ''"
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Build and push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: BananaOps/scope:${{steps.version_tag.outputs.tag}},BananaOps/scope:latest

      - name: Run GoReleaser
        if: "steps.tag.outputs.value != ''"
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-check:
    if: github.event.action == 'labeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout@v4
      - name: Post bumpr status comment
        uses: haya14busa/action-bumpr@a2a70ab97602f0d0f2d23ff3c9f8d7144a99f6e7 # haya14busa/action-bumpr@v1
